name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ice-config.js
        env:
          METERED_API_KEY: ${{ secrets.METERED_API_KEY }}
        run: |
          if [ -z "$METERED_API_KEY" ]; then
            echo "METERED_API_KEY secret is missing" >&2
            exit 1
          fi
          python3 <<'PY'
          import os
          from pathlib import Path
          key = os.environ["METERED_API_KEY"]
          # Escape for a double-quoted JS string
          key_esc = key.replace("\\", "\\\\").replace('"', '\\"')
          url = f"https://fulline.metered.live/api/v1/turn/credentials?apiKey={key_esc}"
          Path("docs/js/ice-config.js").write_text(
              "/** Generated by GitHub Actions — do not commit. */\n"
              f'export const TURN_CREDENTIALS_URL = "{url}";\n',
              encoding="utf-8",
          )
          print("Wrote docs/js/ice-config.js")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
