<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THE NOODLES</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="assets/icon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/game.css" />
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  </head>
  <body>
    <p id="global-status" aria-live="polite"></p>

    <main id="lobby" class="lobby-stage">
      <section class="lobby-visual" aria-label="タイトル">
        <header class="hero">
          <h1 class="hero-title">
            <img src="assets/title.png" alt="THE NOODLES" class="title-logo" width="640" height="128" />
          </h1>
          <p class="hero-sub">カードでラーメンを組み立て、<br class="hero-sub-br" />先に目標点を目指す対戦ゲーム</p>
        </header>
        <div class="lobby-card-fan" aria-hidden="true">
          <img class="lobby-fan-card" style="--i:0" src="assets/cards/noodle.png" alt="" />
          <img class="lobby-fan-card" style="--i:1" src="assets/cards/pork.png" alt="" />
          <img class="lobby-fan-card" style="--i:2" src="assets/cards/soy.png" alt="" />
          <img class="lobby-fan-card" style="--i:3" src="assets/cards/green-onion.png" alt="" />
          <img class="lobby-fan-card" style="--i:4" src="assets/cards/egg.png" alt="" />
        </div>
      </section>

      <section class="lobby-panel">
        <div class="lobby-card">
          <label for="name-input">表示名</label>
          <input id="name-input" type="text" maxlength="16" placeholder="あなたの名前" autocomplete="nickname" />

          <div class="lobby-settings">
            <details class="lobby-details lobby-details-rules" open>
              <summary>ルールセット <span class="details-summary-val">THE NOODLES</span></summary>
              <fieldset class="rule-fieldset nested">
                <label class="radio-row">
                  <input type="radio" name="rule-set" value="noodles" checked />
                  THE NOODLES（★あり/オリジナルルール）
                </label>
                <label class="radio-row">
                  <input type="radio" name="rule-set" value="classic" />
                  stir fly eighteen（★なし/本家ルール）
                </label>
              </fieldset>
            </details>

            <details class="lobby-details lobby-details-match" open>
              <summary>対戦設定 <span class="details-summary-val">50点・15秒・2人</span></summary>
              <fieldset class="rule-fieldset settings-fieldset nested lobby-settings-grid">
                <div class="lobby-setting-cell">
                  <label for="win-score">目標ポイント</label>
                  <input id="win-score" type="number" min="20" max="100" step="5" value="50" title="先取" />
                </div>
                <div class="lobby-setting-cell">
                  <label for="taste-sec">味見（秒）</label>
                  <input id="taste-sec" type="number" min="0" max="60" step="1" value="15" title="0で制限なし" />
                </div>
                <div class="lobby-setting-cell lobby-setting-seats">
                  <label for="seat-count">人数</label>
                  <select id="seat-count" aria-label="人数">
                    <option value="2" selected>2人</option>
                    <option value="3">3人</option>
                    <option value="4">4人</option>
                  </select>
                </div>
                <p class="settings-hint">ホストとソロで同じ席数（不足分はCPU）。味見0＝制限なし。デフォルトは50点・15秒・2人。</p>
              </fieldset>
            </details>
          </div>

          <div class="btn-row">
            <button type="button" class="btn primary" id="btn-host">部屋を作る（ホスト）</button>
            <div class="btn-row-rest">
              <div class="join-row">
                <input id="room-input" type="text" maxlength="8" placeholder="部屋コード" autocomplete="off" aria-label="部屋コード" />
                <button type="button" class="btn" id="btn-join">部屋に参加</button>
              </div>
              <button type="button" class="btn" id="btn-solo">1人でプレイ</button>
              <div class="lobby-guide-row">
                <button type="button" class="btn ghost" id="btn-rules">ルール</button>
                <button type="button" class="btn ghost" id="btn-effects">効果表</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="table" hidden></div>

    <div id="lobby-rules-modal" class="modal-backdrop" hidden>
      <div class="modal rules-modal" role="dialog" aria-labelledby="lobby-rules-title" onclick="event.stopPropagation()">
        <header class="ref-header">
          <h2 id="lobby-rules-title">ゲームルール</h2>
          <button type="button" class="modal-close" id="btn-close-lobby-rules" aria-label="閉じる">×</button>
        </header>
        <div class="rules-sheet">
          <img src="assets/cards/rules.png" alt="THE NOODLES ルール" />
        </div>
      </div>
    </div>

    <div id="lobby-effects-modal" class="modal-backdrop" hidden>
      <div class="modal ref-modal" role="dialog" aria-labelledby="lobby-effects-title" onclick="event.stopPropagation()">
        <header class="ref-header">
          <h2 id="lobby-effects-title">カードの効果</h2>
          <button type="button" class="modal-close" id="btn-close-lobby-effects" aria-label="閉じる">×</button>
        </header>
        <div id="lobby-effects-tabs" class="panel-tabs ref-tabs" role="tablist"></div>
        <div id="lobby-effects-list" class="ref-list"></div>
      </div>
    </div>

    <div id="lobby-host-confirm" class="modal-backdrop" hidden>
      <div class="modal host-confirm-modal" role="dialog" aria-labelledby="host-confirm-title" onclick="event.stopPropagation()">
        <header class="ref-header">
          <h2 id="host-confirm-title">この設定で部屋を作りますか？</h2>
          <button type="button" class="modal-close" id="btn-close-host-confirm" aria-label="閉じる">×</button>
        </header>
        <div class="host-confirm-body">
          <ul id="host-confirm-summary" class="host-confirm-list"></ul>
          <p class="hint">あとから参加者側では変更できません。ホストの設定が使われます。</p>
          <div class="host-confirm-actions">
            <button type="button" class="btn ghost" id="btn-host-cancel">もどる</button>
            <button type="button" class="btn primary" id="btn-host-confirm">この設定で作る</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
